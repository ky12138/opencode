name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: 

env:
  BUN_VERSION: '1.3.5'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      # 优化 1: fetch-depth: 1 (默认其实就是 1，但显式写出以防万一)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # 专门为 TUI 构建设置独立的缓存 Key，避免和全量构建冲突
          key: ${{ runner.os }}-bun-tui-only-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-tui-only-

      # 关键优化：只安装 opencode 及其依赖的 workspace 包
      # 这将跳过 packages/desktop 等其他兄弟文件夹
      - name: Install TUI Dependencies Only
        run: |
          bun install --filter opencode --frozen-lockfile
        shell: bash

      - name: Build Windows
        run: |
          cd packages/opencode
          bun run script/build.ts --single --skip-install
        shell: bash

      - name: Upload Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64/bin/opencode.exe
          retention-days: 1
          # 优化 5: 降低压缩等级以换取速度 (0-9，默认是 6)
          # EXE 文件本身很难压缩，设为 0 或 1 可以让上传这一步快几秒到几十秒
          compression-level: 1